[project]
name = "researchclaw"
version = "0.5.0"
description = "AutoResearchClaw — Autonomous Research Pipeline. Turn any research idea into a paper."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "arxiv>=2.1",
    "numpy>=1.24",
    # G4-M1 (P-101): registry validation runs on the core startup path and is
    # fail-closed (A4-1), so the schema validator cannot live in an optional extra.
    "jsonschema>=4.20",
]
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
anthropic = ["httpx>=0.24"]
server = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0"]
mcp = ["mcp>=2.1,<3"]
voice = ["httpx>=0.24"]
# scholarly 1.7.x imports bibtexparser.bibdatabase, which was removed in
# bibtexparser 2.x and is not upper-bounded by scholarly's own metadata, so
# the pin below is required for `import scholarly` to succeed.
web = ["scholarly>=1.7", "bibtexparser<2", "crawl4ai>=0.2", "tavily-python>=0.3"]
pdf = ["PyMuPDF>=1.23"]
all = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "mcp>=2.1,<3",
    "httpx>=0.24",
    "scholarly>=1.7",
    "bibtexparser<2",
    "crawl4ai>=0.2",
    "tavily-python>=0.3",
    "PyMuPDF>=1.23",
    "huggingface-hub>=0.20",
    "matplotlib>=3.7",
    "scipy>=1.10",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
    "jsonschema>=4.20",
    "build>=1.2,<2",
    "hatchling>=1.30,<2",
]

[project.scripts]
researchclaw = "researchclaw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["researchclaw"]
# P-103 (D-1): ship the tool registry inside the wheel so fail-closed startup
# validation works for pip-installed users as well.
force-include = {"tools/registry.yaml" = "researchclaw/tools/registry.yaml"}

[build-system]
requires = ["hatchling>=1.30,<2"]
build-backend = "hatchling.build"
