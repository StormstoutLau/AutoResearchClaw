name: CI

on:
  push:
  pull_request:

jobs:
  packaging:
    name: Packaging / wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build hatchling

      - name: Build wheel
        run: python -m build --wheel --outdir dist

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import collections
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          duplicates = [
              name for name, count in collections.Counter(names).items() if count > 1
          ]
          assert not duplicates, f"duplicate wheel paths: {duplicates}"

          required = [
              "researchclaw/templates/styles/iclr_2025/iclr2025_conference.sty",
              "researchclaw/templates/styles/iclr_2025/iclr2025_conference.bst",
              "researchclaw/vendor/auto_prover/LICENSE",
              "researchclaw/vendor/auto_prover/NOTICE",
          ]
          for path in required:
              assert path in names, f"missing wheel asset: {path}"

          assert any(n.endswith("SKILL.md") and "/skills/builtin/" in n for n in names)
          assert any(n.startswith("researchclaw/domains/profiles/") and n.endswith(".yaml") for n in names)
          print(f"wheel OK: {wheel} ({len(names)} files)")
          PY

      - name: Install wheel and run CLI
        run: |
          python -m pip install dist/*.whl
          researchclaw --help

  extras:
    name: Extras import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install optional extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,mcp,voice]"

      - name: Verify imports
        run: python -c "import fastapi, uvicorn, httpx, mcp; print('extras OK')"

      - name: Assert MCP SDK version (P-094 / P-093 §6.3)
        run: |
          python -c "import importlib.metadata as m; v = tuple(int(p) for p in m.version('mcp').split('.')[:2]); assert v >= (2, 1), f'mcp {v} does not satisfy pin >=2.1,<3'; print('mcp OK', v)"

  tests:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - python-version: "3.14"
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,server,mcp]"

      - name: Run contract tests
        run: |
          python -m pytest \
            tests/test_packaging.py \
            tests/test_run_state.py \
            tests/test_frontend_mount.py \
            tests/test_mcp.py \
            tests/test_mcp_protocol.py \
            tests/test_simulated_guard.py \
            tests/test_cost_tracker.py \
            tests/test_docs_and_adapters.py \
            tests/test_rc_config.py \
            tests/test_cli.py \
            tests/test_stage12_returncode.py \
            tests/test_stage_retries.py \
            tests/test_claim_verifier_wiring.py \
            tests/test_contracts_v1.py \
            tests/test_g2_ar_checks.py \
            tests/test_vendor_auto_prover.py \
            tests/test_vendor_d110_verdict_policy.py \
            tests/test_vendor_d110_verdict_recheck.py \
            tests/test_vendor_semantic_verdict.py \
            tests/test_evidence_sidecar.py \
            tests/test_evidence_sidecar_live.py \
            tests/test_claim_policy.py \
            tests/test_claim_spine.py \
            tests/test_mandate.py \
            tests/test_k5_refs.py \
            tests/test_k5_wiring.py \
            tests/test_stage_claim_hooks.py \
            tests/test_offline_audit.py \
            tests/test_artifact_node.py \
            tests/test_pipeline_summary_check.py \
            tests/test_stage_events.py \
            tests/test_filelock.py \
            tests/test_spec_map_tiers.py \
            tests/test_retrieval_degraded.py \
            tests/test_forged_execution_guards.py \
            tests/test_env_allowlist.py \
            tests/test_safe_join.py \
            tests/test_cors_default.py \
            -q

  roadmap-coverage:
    name: Roadmap coverage gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Acceptance coverage check (D-6)
        run: python scripts/spec/roadmap_coverage_check.py --check

      - name: CLI code agent wiring guard
        run: python scripts/code_agent_wiring_check.py

      - name: Private endpoint / credential guard
        run: python scripts/private_config_check.py

  spec-gates:
    # A0-6：六必需钩子 + 三额外守卫全量运行；不依赖 tests 产物，与 3.11–3.13 矩阵并行。
    name: Spec gates (pre-commit all-files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # P-081：range 兜底需要 before/base 的祖先可见

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit pyyaml
          python -m pip install -e ".[dev]"

      - name: Gate selftests
        run: |
          python scripts/spec/grandfather_gate.py --selftest
          python scripts/spec/m7_stats.py
          python scripts/spec/repo_stats.py --check
          python scripts/spec/blackbox_check.py

      - name: Batch binding on the pushed range (P-081)
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "no base sha (first push or non-push event) — skipping range check"
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "base ${BASE_SHA} is not in this clone — skipping range check"
            exit 0
          fi
          mapfile -t CHANGED < <(git diff --name-only "${BASE_SHA}...HEAD")
          echo "changed paths in range: ${#CHANGED[@]}"
          python scripts/spec/step_enforce.py --base "${BASE_SHA}" "${CHANGED[@]}"
          for sha in $(git rev-list --merges "${BASE_SHA}..HEAD"); do
            echo "checking merge commit ${sha}"
            python scripts/spec/step_enforce.py --check-merge "${sha}"
          done

      - name: Run all pre-commit gates
        run: pre-commit run --all-files --show-diff-on-failure

